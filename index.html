<!DOCTYPE html>

<head>

<title>Turf Manager</title>
<style>
:root{--bg:#f1f5ee;--sf:#fff;--tx:#17301c;--mu:#5d6f5f;--ac:#2f7d32;--ac2:#e1f0dd;--bd:#d3dfcf;--bad:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a12;--sf:#182319;--tx:#e8f2e6;--mu:#98ad9a;--ac:#6fcf73;--ac2:#213a24;--bd:#2c3f2e;--bad:#ff8a7a}}
:root[data-theme="dark"]{--bg:#101a12;--sf:#182319;--tx:#e8f2e6;--mu:#98ad9a;--ac:#6fcf73;--ac2:#213a24;--bd:#2c3f2e;--bad:#ff8a7a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Sinhala","Noto Sans Tamil","Iskoola Pota",system-ui,sans-serif;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:12px 14px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:1.2rem;margin:6px 0}
#lang{width:auto;padding:6px 8px}
nav{display:flex;gap:6px;overflow-x:auto;padding:6px 0;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{flex:0 0 auto;border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:8px 13px;border-radius:20px;font:inherit;font-size:.88rem;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
section{display:none;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px}
section.on{display:block}
label{display:block;font-size:.85rem;color:var(--mu);margin:10px 0 4px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;font-size:.95rem}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer;margin-top:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 130px}
.card{border:1px solid var(--bd);border-radius:10px;padding:10px;margin-top:10px;background:var(--bg)}
.card h3{margin:0 0 4px;font-size:1rem}
.big{font-size:1.3rem;font-weight:700}
.pos{color:var(--ac)}.neg{color:var(--bad)}
small,.mu{color:var(--mu)}
.item{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.x{background:none;border:0;color:var(--mu);cursor:pointer;font-size:1.1rem}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--ac2);font-size:.75rem;margin-left:4px}
.tag.bad{background:var(--bad);color:#fff}
details{border:1px solid var(--bd);border-radius:10px;margin-top:8px;background:var(--bg)}
summary{padding:10px;cursor:pointer;font-weight:600}
details div{padding:0 10px 10px}
a{color:var(--ac)}
nav button{text-align:center;min-width:70px;font-size:.78rem;padding:6px 10px}
.ic{display:block;font-size:1.5rem;line-height:1.3}
.me{display:block;width:140px;height:140px;border-radius:50%;object-fit:cover;margin:6px auto 10px;border:3px solid var(--ac2)}
.who{text-align:center;font-size:1.15rem;font-weight:700;margin:0}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.pad button{padding:12px 0;border:1px solid var(--bd);border-radius:8px;background:var(--sf);color:var(--tx);font:inherit;font-size:1.05rem;cursor:pointer}
.pad .op{background:var(--ac2);color:var(--ac)}
#c-disp{text-align:right;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);overflow-x:auto}
</style>
</head>

let DB=null,UID=null,MK=[];
function mkRender(){

const C={cur:"0",acc:null,op:null,fresh:true};
const cApply=(a,o,b)=>o==="+"?a+b:o==="-"?a-b:o==="*"?a*b:(b===0?0:a/b);
const cFmt=n=>String(+n.toFixed(6));
document.addEventListener("click",e=>{const el=e.target.closest("[data-a=calc]");if(!el)return;const v=el.dataset.v;
if(/^[0-9]$/.test(v)){C.cur=C.fresh||C.cur==="0"?v:C.cur+v;C.fresh=false}
else if(v==="."){if(C.fresh){C.cur="0.";C.fresh=false}else if(!C.cur.includes("."))C.cur+="."}
else if(v==="C"){C.cur="0";C.acc=null;C.op=null;C.fresh=true}
else if(v==="="){if(C.op!==null){C.cur=cFmt(cApply(C.acc,C.op,parseFloat(C.cur)));C.acc=null;C.op=null;C.fresh=true}}
else if(v==="use"){const n=parseFloat(C.cur);if(n>0)$("r-a").value=n}
else{if(C.op!==null&&!C.fresh){C.acc=cApply(C.acc,C.op,parseFloat(C.cur));C.cur=cFmt(C.acc)}else C.acc=parseFloat(C.cur);C.op=v;C.fresh=true}
$("c-disp").textContent=Number(C.cur).toString()===C.cur||C.cur.endsWith(".")?C.cur:C.cur});
